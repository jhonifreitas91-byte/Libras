<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libras na Prática</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{
  min-height:100%;
  scroll-behavior:auto;
}

body{
  min-height:100vh;
  background:#f5f8ff;
  font-family:Arial,Helvetica,sans-serif;
  color:#0b1f4d;
  position:relative;
  overflow-x:hidden;
  padding:24px 14px 30px;
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  border-radius:50%;
  background:#1769ff;
  opacity:.1;
  filter:blur(90px);
  pointer-events:none;
  z-index:0;
}

body:before{top:-230px;left:-190px}
body:after{bottom:-230px;right:-190px}

.container{
  width:100%;
  max-width:430px;
  margin:0 auto;
  position:relative;
  z-index:2;
  text-align:center;
}

.imagem{
  width:190px;
  height:190px;
  max-width:100%;
  object-fit:cover;
  border:4px solid #1769ff;
  border-radius:22px;
  display:block;
  margin:0 auto 24px;
  padding:4px;
  background:#fff;
  box-shadow:0 0 0 6px rgba(23,105,255,.10),0 12px 30px rgba(23,105,255,.14);
}

.gancho{
  display:inline-block;
  padding:9px 14px;
  margin-bottom:18px;
  border-radius:999px;
  background:#eaf3ff;
  color:#1769ff;
  font-size:13px;
  line-height:1.25;
  font-weight:800;
}

.titulo{
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.7px;
  margin:0 auto 14px;
  max-width:390px;
}

.subtitulo{
  font-size:16px;
  line-height:1.45;
  color:#435273;
  max-width:360px;
  margin:0 auto 24px;
}

.mini-beneficios{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.mini-beneficios span{
  padding:9px 11px;
  background:#fff;
  border:1px solid #dce6f8;
  border-radius:12px;
  color:#26385d;
  font-size:12px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(18,54,110,.05);
}

.preco-ponte{
  background:linear-gradient(135deg,#1769ff,#0750d9);
  color:#fff;
  border-radius:20px;
  padding:17px 15px 18px;
  margin-bottom:18px;
  box-shadow:0 14px 32px rgba(23,105,255,.25);
}

.preco-ponte span{
  display:block;
  font-size:12px;
  font-weight:800;
  opacity:.9;
  margin-bottom:5px;
}

.preco-ponte strong{
  display:block;
  font-size:38px;
  line-height:1;
  letter-spacing:-1px;
}

.botao{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 12px;
  background:#16bf62;
  color:#fff;
  text-decoration:none;
  font-size:17px;
  font-weight:900;
  border-radius:13px;
  box-shadow:0 10px 24px rgba(22,191,98,.28);
}

.microcopy{
  font-size:11.5px;
  line-height:1.4;
  color:#66738e;
  margin-top:12px;
}

@media(max-width:420px){
  body{padding:18px 12px 24px}

  .imagem{
    width:175px;
    height:175px;
    margin-bottom:21px;
  }

  .gancho{
    margin-bottom:16px;
  }

  .titulo{
    font-size:25px;
    margin-bottom:12px;
  }

  .subtitulo{
    font-size:14.5px;
    margin-bottom:21px;
  }

  .mini-beneficios{
    margin-bottom:21px;
    gap:7px;
  }

  .mini-beneficios span{
    font-size:11px;
    padding:8px 9px;
  }

  .preco-ponte{
    margin-bottom:17px;
  }

  .botao{
    font-size:16px;
  }
}
</style>
</head>

<body>
<main class="container">

  <img
    src="imagem.jpg"
    alt="Libras na Prática"
    class="imagem"
  >

  <div class="gancho">
    👋 <strong>Você consegue começar a aprender Libras hoje.</strong>
  </div>

  <h1 class="titulo">
    Veja como é simples começar.
  </h1>

  <p class="subtitulo">
    Conheça o <strong>Libras na Prática</strong> e veja o material completo no próximo passo.
  </p>

  <div class="mini-beneficios">
    <span>✓ Visual</span>
    <span>✓ +100 páginas</span>
    <span>✓ Pronto para imprimir</span>
  </div>

  <div class="preco-ponte">
    <span>Por apenas</span>
    <strong>R$10,00</strong>
  </div>

  <a
    href="https://seguro.pague.click/api/public/shopify?product=1899545811875&store=18995"
    class="botao"
  >
    VER O LIBRAS NA PRÁTICA →
  </a>

  <div class="microcopy">
    No próximo passo você vê todos os detalhes.
  </div>

</main>

<script>
if ("scrollRestoration" in history) {
  history.scrollRestoration = "manual";
}

window.addEventListener("load", function () {
  window.scrollTo(0, 0);
});
</script>

</body>
</html>
