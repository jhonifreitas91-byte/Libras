<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animações azuis no fundo */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: #0066ff;
            opacity: 0.08;
            filter: blur(80px);
            animation: flutuar 7s ease-in-out infinite alternate;
        }

        body::before {
            top: -180px;
            left: -150px;
        }

        body::after {
            bottom: -180px;
            right: -150px;
            animation-delay: -3s;
        }

        @keyframes flutuar {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 70px) scale(1.25);
            }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .imagem {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 5px solid #0066ff;
            border-radius: 20px;
            display: block;
            margin: 0 auto 25px;
        }

        .botao {
            display: inline-block;
            padding: 18px 40px;
            background: #0066ff;
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.25);
        }

        .botao:hover {
            background: #0052cc;
            transform: scale(1.03);
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        /* Bolinha verde pulsante */
        .bolinha-online {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulsar 1.5s infinite;
        }

        @keyframes pulsar {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .promocao {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #222222;
        }

        .timer {
            color: #0066ff;
            font-size: 16px;
            font-weight: bold;
            min-width: 65px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Troque "imagem.jpg" pelo nome da sua imagem -->
        <img src="imagem.jpg" alt="Imagem" class="imagem">

        <a href="https://seguro.pague.click/api/public/shopify?product=1899545811875&store=18995" class="botao">
            ACESSE AGORA -
            <span class="online">
                <span class="bolinha-online"></span>
                67 Pessoas online
            </span>
        </a>

        <div class="promocao">
            <span>Quando o cronômetro zerar, a promoção acaba!</span>
            <span class="timer" id="timer">00:01:00</span>
        </div>

    </div>

    <script>
        let tempo = 60;

        function atualizarTimer() {
            const minutos = Math.floor(tempo / 60);
            const segundos = tempo % 60;

            const minutosFormatados = String(minutos).padStart(2, "0");
            const segundosFormatados = String(segundos).padStart(2, "0");

            document.getElementById("timer").textContent =
                `00:${minutosFormatados}:${segundosFormatados}`;

            if (tempo <= 0) {
                tempo = 60;
            } else {
                tempo--;
            }
        }

        atualizarTimer();

        setInterval(atualizarTimer, 1000);
    </script>

</body>
</html>
