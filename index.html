<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .imagem {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 5px solid #0066ff;
            border-radius: 20px;
            display: block;
            margin: 0 auto 25px;
        }

        .botao {
            display: inline-block;
            padding: 14px 35px;
            background: #0066ff;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }

        .botao:hover {
            background: #0052cc;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Troque "imagem.jpg" pelo nome da sua imagem -->
        <img src="imagem.jpg" alt="Imagem" class="imagem">

        <a href="https://seguro.pague.click/api/public/shopify?product=1899545811875&store=18995" class="botao">Acessar agora</a>

    </div>

</body>
</html>
